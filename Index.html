<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Button Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f4;
        }

        button {
            padding: 12px 25px;
            background: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            display: block;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <button>
        <a href="https://example.com">Go to Website</a>
    </button>

</body>
</html>
